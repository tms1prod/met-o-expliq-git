<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Météo Cool</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=device_thermostat" />


</head>
<body>
   <div class="container">
        <header>
            <h1>Météo du futur</h1>
        </header>

        <div class="weather-card">

            <div class="search-bar">
                <input type="text" id="city" placeholder="Entrez une ville">
                <button id="search-btn">
                    <span class="material-symbols-outlined">ok</span>
                </button>
            </div>

            <div id="ville">
                <div class="ville">Toulousex
                    <span class="material-symbols-outlined"></span>
                    <p id="description">Ciel dégagé</p>
                    <p id="humidite">Humidité : 45%</p>12°C
                </div>
                <div class="ville">paris
                    <span class="material-symbols-outlined"></span>
                    <p id="description">Ciel dégagé</p>
                    <p id="humidite">Humidité : 45%</p>12°C
                </div>
                <div class="ville">Marseille
                    <span class="material-symbols-outlined"></span>
                    <p id="description">Ciel dégagé</p>
                    <p id="humidite">Humidité : 45%</p>12°C
                </div>
               
            </div>
        </div>
   </div>
</body>
    <script src="script.js"></script>
</html>
